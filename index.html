<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#09090b" />
    <meta name="description" content="Gian Karlo C. Reguindin — 3rd Year BSCS student and aspiring web developer building thoughtful, user-friendly digital experiences." />
    <meta property="og:title" content="Gian Karlo C. Reguindin — Aspiring Web Developer" />
    <meta property="og:description" content="Personal portfolio and software engineering case studies by Gian Karlo C. Reguindin." />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Gian Karlo C. Reguindin — Aspiring Web Developer</title>

    <!-- Geist + Geist Mono + Source Serif 4 (Google Fonts) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@300..800&family=Geist+Mono:wght@300..600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400..600;1,8..60,400&display=swap"
      rel="stylesheet"
    />

    <script>
      (function () {
        var KEY = 'gk_theme';
        var root = document.documentElement;
        var mq = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)');
        function pref() {
          try {
            var v = localStorage.getItem(KEY);
            if (v === 'light' || v === 'dark' || v === 'system') return v;
          } catch (e) {}
          return 'dark';
        }
        function isDark(p) {
          return p === 'dark' || (p === 'system' && mq && mq.matches);
        }
        function applyTheme(p) {
          var dark = isDark(p);
          root.classList.toggle('dark', dark);
          root.dataset.themePref = p;
          root.style.colorScheme = dark ? 'dark' : 'light';
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', dark ? '#09090b' : '#ffffff');
          window.dispatchEvent(new CustomEvent('gk-theme-change', { detail: { pref: p, dark: dark } }));
        }
        window.setPortfolioTheme = function (p, ev) {
          try {
            localStorage.setItem(KEY, p);
          } catch (e) {}
          var nextDark = isDark(p);
          var curDark = root.classList.contains('dark');
          if (nextDark === curDark) {
            applyTheme(p);
            return;
          }
          var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
          if (reduce || !document.startViewTransition) {
            root.classList.add('theme-xfade');
            applyTheme(p);
            setTimeout(function () {
              root.classList.remove('theme-xfade');
            }, 520);
            return;
          }
          var x = ev && typeof ev.clientX === 'number' ? ev.clientX : window.innerWidth / 2;
          var y = ev && typeof ev.clientY === 'number' ? ev.clientY : 24;
          var endRadius = Math.hypot(Math.max(x, window.innerWidth - x), Math.max(y, window.innerHeight - y));
          root.style.setProperty('--vt-x', x + 'px');
          root.style.setProperty('--vt-y', y + 'px');
          root.style.setProperty('--vt-r', endRadius + 'px');
          root.classList.add('vt-theme');
          var vt = document.startViewTransition(function () {
            applyTheme(p);
          });
          vt.finished.finally(function () {
            root.classList.remove('vt-theme');
          });
        };
        applyTheme(pref());
        if (mq && mq.addEventListener) {
          mq.addEventListener('change', function () {
            if (pref() === 'system') applyTheme('system');
          });
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
